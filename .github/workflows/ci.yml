name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-macos:
    name: Swift ${{ matrix.swift }} on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
    runs-on: macos-${{ matrix.macos }}
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: "26"
            swift: "6.2"
            xcode: "26.3"
          - macos: "26"
            swift: "6.3"
            xcode: "26.6"
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch the Lore server
        run: Scripts/fetch-loreserver.sh

      - name: Lint
        run: swift format lint --strict --recursive .

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Integration tests
        run: Scripts/run-integration-tests.sh
